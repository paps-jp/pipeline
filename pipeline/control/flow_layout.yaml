canvas:
  width: 2200
  height: 540
  background: '#0f1120'
nodes:
- id: paprika-links-pull
  kind: workload
  x: 6
  y: -235
  label: URL 発見
  icon: search
  workload_slug: paprika-links-pull
- id: crawl
  kind: tank
  x: 27
  y: -432
  label: crawl (URL総数)
  icon: link
  metric_sql: SELECT COUNT(*) FROM crawl
  metric_ttl_s: 900
  capacity_warn: 500000000
- id: paprika-job-submit
  kind: workload
  x: 310
  y: -431
  label: paprika 投入
  icon: send
  workload_slug: paprika-job-submit
- id: paprika-hub
  kind: external
  x: 331
  y: -213
  label: paprika hub
  icon: server
  url: ''
- id: paprika-image-pull
  kind: workload
  x: 578
  y: -235
  label: 画像 pull
  icon: photo
  workload_slug: paprika-image-pull
- id: crawl_image
  kind: tank
  x: 772
  y: -83
  label: crawl_image (未hash)
  icon: photo
  metric_sql: SELECT COUNT(*) FROM crawl_image WHERE hash_id IS NULL AND ignore_reason
    IS NULL
  capacity_warn: 500000000
- id: image_hash_extract_queue
  kind: tank
  x: 872
  y: -418
  label: img_hash_q
  icon: list
  metric_sql: SELECT COUNT(*) FROM image_hash_extract_queue WHERE state='pending'
  capacity_warn: 50000
- id: image-hash-extract
  kind: workload
  x: 919
  y: -570
  label: hash + detect
  icon: scan
  workload_slug: image-hash-extract
  # supervisor 需要ベース配分: 上流タンクにまだ在庫があれば動かす。
  # crawl_image の filter は「downloaded_at is not null AND hash_id is null」= 未hash画像実残数。
  demand_from: [image_hash_extract_queue, crawl_image]
- id: crawl_face
  kind: tank
  x: 1243
  y: -410
  label: crawl_face (未embed)
  icon: face
  metric_sql: SELECT COUNT(*) FROM crawl_face WHERE adaface_ready=0
  capacity_warn: 500000000
- id: image-embed
  kind: workload
  x: 1222
  y: -214
  label: embed 計算
  icon: brain
  workload_slug: image-embed
  # supervisor 需要ベース配分: crawl_face の filter は adaface_ready=0 (=未embed実残数)。
  # dispatcher-elimination 後、 embed は crawl_face から直 claim するため
  # image_embed_queue はほぼ 0 = 自 backlog では真の需要 (~74M) が見えない。
  demand_from: [image_embed_queue, crawl_face]
- id: paprika-video-pull
  kind: workload
  x: 310
  y: -63
  label: 動画 pull
  icon: video
  workload_slug: paprika-video-pull
- id: crawl_video
  kind: tank
  x: 329
  y: 147
  label: crawl_video pending
  icon: video
  metric_sql: SELECT COUNT(*) FROM crawl_video WHERE download_status='pending'
  capacity_warn: 20000
- id: video-dispatcher
  kind: workload
  x: 308
  y: 411
  label: 動画 dispatch
  icon: arrows-split
  workload_slug: video-dispatcher
- id: video-face-extract
  kind: workload
  x: 915
  y: 412
  label: 動画→顔抽出
  icon: faces
  workload_slug: video-face-extract
  # supervisor 需要ベース配分。 video_face_extract_queue が自 queue (dispatcher が enqueue)。
  demand_from: [video_face_extract_queue]
- id: embed-write
  kind: workload
  x: 1223
  y: 159
  label: embed 書込
  icon: database-import
  workload_slug: embed-write
- id: embed_write_queue
  kind: tank
  x: 1242
  y: -36
  label: embed_write_q
  icon: database-import
  metric_sql: SELECT COUNT(*) FROM crawl_embedding_write_queue WHERE state='pending'
  capacity_warn: 20000
- id: crawl_embedding_final
  kind: tank
  x: 1244
  y: 401
  label: crawl_embedding_index (final)
  icon: database
  metric_sql: SELECT COUNT(*) FROM crawl_embedding_index
  metric_ttl_s: 900
  capacity_warn: 500000000
- id: faiss_unindexed
  kind: tank
  x: 1930
  y: 401
  # 検索 index に未反映のベクトル数 = faiss_ready=0 の shard に入っている分。
  # 再構築が終われば書き込み中の現用 shard 分 (数十万) だけが残る。
  label: FAISS 未反映 (vec)
  icon: database
  metric_sql: SELECT COALESCE(SUM(used_count),0) FROM crawl_embedding_shard WHERE faiss_ready=0
  metric_ttl_s: 300
  capacity_warn: 15000000
- id: faiss-index-build
  kind: workload
  x: 1910
  y: 190
  label: FAISS 再構築
  icon: cpu
  workload_slug: faiss-index-build
- id: faiss-api
  kind: external
  x: 1930
  y: -55
  label: FAISS 検索 API
  icon: search
  url: ''
- id: face_person_link_queue
  kind: tank
  x: 1602
  y: -55
  label: person_link_q
  icon: list
  metric_sql: SELECT COUNT(*) FROM face_person_link_queue WHERE state='pending'
  capacity_warn: 50000
- id: face-person-link
  kind: workload
  x: 1582
  y: 190
  label: person 統合
  icon: users
  workload_slug: face-person-link
- id: crawl_person
  kind: tank
  x: 1602
  y: 408
  label: crawl_person (集約)
  icon: users-group
  metric_sql: SELECT COUNT(*) FROM crawl_person
  metric_ttl_s: 900
  capacity_warn: 500000000
- id: crawl_video_hash
  kind: tank
  x: 934
  y: 218
  label: crawl_video_hash (binary 集約)
  icon: fingerprint
  metric_sql: SELECT COUNT(*) FROM crawl_video_hash
  metric_ttl_s: 300
  capacity_warn: 500000000
- id: crawl_image_hash
  kind: tank
  x: 610
  y: -570
  label: crawl_image_hash (binary 集約)
  icon: fingerprint
  metric_sql: SELECT COUNT(*) FROM crawl_image_hash
  metric_ttl_s: 900
  capacity_warn: 500000000
- id: image_embed_queue
  kind: tank
  x: 1252
  y: -573
  label: img_embed_q
  icon: list
  metric_sql: SELECT COUNT(*) FROM image_embed_queue WHERE state='pending'
  capacity_warn: 50000
- id: video_dispatcher_queue
  kind: tank
  x: 37
  y: 411
  label: video_dispatch_q
  icon: list
  metric_sql: SELECT COUNT(*) FROM video_dispatcher_queue WHERE state='pending'
  capacity_warn: 50000
- id: video_face_extract_queue
  kind: tank
  x: 640
  y: 412
  label: video_face_q
  icon: list
  metric_sql: SELECT COUNT(*) FROM video_face_extract_queue WHERE state='pending'
  capacity_warn: 50000
- id: paprika_image_pull_queue
  kind: tank
  x: 599
  y: -426
  label: papri_img_q
  icon: list
  metric_sql: SELECT COUNT(*) FROM paprika_image_pull_queue WHERE state='pending'
  capacity_warn: 50000
- id: paprika_video_pull_queue
  kind: tank
  x: 51
  y: -64
  label: papri_video_q
  icon: list
  metric_sql: SELECT COUNT(*) FROM paprika_video_pull_queue WHERE state='pending'
  capacity_warn: 50000
- id: paprika_links_pull_queue
  kind: tank
  x: -293
  y: -234
  label: papri_links_q
  icon: list
  metric_sql: SELECT COUNT(*) FROM paprika_links_pull_queue WHERE state='pending'
  capacity_warn: 50000
- id: paprika_job_submit_queue
  kind: tank
  x: 333
  y: -583
  label: papri_job_q
  icon: list
  metric_sql: SELECT COUNT(*) FROM paprika_job_submit_queue WHERE state='pending'
  capacity_warn: 50000
- id: minio-image-ram
  kind: tank
  x: 609
  y: 140
  label: 画像RAM (.47)
  icon: database
  unit: GB
  metric_sql: SELECT IF(updated_at > NOW() - INTERVAL 5 MINUTE, ROUND(used_bytes/1073741824,1),
    ROUND(total_bytes/1073741824,1)) FROM storage_capacity WHERE name='image-ram-47'
  capacity_sql: SELECT ROUND(total_bytes/1073741824,1) FROM storage_capacity WHERE
    name='image-ram-47'
  capacity_warn: 100
- id: minio-video-ram
  kind: tank
  x: 47
  y: 141
  label: 動画RAM (.48)
  icon: database
  unit: GB
  metric_sql: SELECT IF(updated_at > NOW() - INTERVAL 5 MINUTE, ROUND(used_bytes/1073741824,1),
    ROUND(total_bytes/1073741824,1)) FROM storage_capacity WHERE name='video-ram-48'
  capacity_sql: SELECT ROUND(total_bytes/1073741824,1) FROM storage_capacity WHERE
    name='video-ram-48'
  capacity_warn: 100
edges:
- from: paprika-links-pull
  to: crawl
  label: URL/min
  metric_field: inserted
- from: crawl
  to: paprika-job-submit
- from: paprika-job-submit
  to: paprika-hub
  label: job/min
  metric_field: submitted
- from: paprika-hub
  to: paprika-image-pull
  dashed: true
- from: paprika-hub
  to: paprika-video-pull
  dashed: true
- from: paprika-hub
  to: paprika-links-pull
  dashed: true
- from: paprika-image-pull
  to: crawl_image
  label: img/tick
  metric_field: inserted
- from: paprika-image-pull
  to: image_hash_extract_queue
- from: image_hash_extract_queue
  to: image-hash-extract
- from: image-hash-extract
  to: crawl_face
- from: image-hash-extract
  to: crawl_image_hash
  label: hash
- from: crawl_image_hash
  to: image-hash-extract
  dashed: true
- from: image-embed
  to: embed_write_queue
  label: write_q
- from: paprika-video-pull
  to: crawl_video
  label: video/tick
  metric_field: inserted
- from: crawl_video
  to: video-dispatcher
- from: video-dispatcher
  to: video_face_extract_queue
  label: task
  metric_field: enqueued
- from: video-face-extract
  to: crawl_face
  label: face/run
  metric_field: face_ids_inserted
- from: video-face-extract
  to: image_embed_queue
- from: video-face-extract
  to: crawl_video_hash
  label: hash
- from: crawl_video_hash
  to: video-face-extract
  dashed: true
- from: embed_write_queue
  to: embed-write
- from: embed-write
  to: crawl_embedding_final
  label: final
  metric_field: deleted_from_queue
- from: embed-write
  to: face_person_link_queue
  label: enq
- from: face_person_link_queue
  to: face-person-link
- from: face-person-link
  to: crawl_person
  label: person
# FAISS: shard に積まれた未反映ベクトル → 週次 (条件駆動) 再構築 → 検索 API へ reload
- from: crawl_embedding_final
  to: faiss_unindexed
  dashed: true
- from: faiss_unindexed
  to: faiss-index-build
- from: faiss-index-build
  to: faiss-api
  label: reload
- from: image-hash-extract
  to: image_embed_queue
- from: image_embed_queue
  to: image-embed
- from: video_face_extract_queue
  to: video-face-extract
- from: video-dispatcher
  to: video_dispatcher_queue
- from: video_dispatcher_queue
  to: video-dispatcher
- from: paprika-links-pull
  to: paprika_links_pull_queue
- from: paprika_links_pull_queue
  to: paprika-links-pull
- from: paprika-image-pull
  to: paprika_image_pull_queue
- from: paprika_image_pull_queue
  to: paprika-image-pull
- from: paprika-video-pull
  to: paprika_video_pull_queue
- from: paprika_video_pull_queue
  to: paprika-video-pull
- from: paprika-job-submit
  to: paprika_job_submit_queue
- from: paprika_job_submit_queue
  to: paprika-job-submit
