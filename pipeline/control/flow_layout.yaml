- id: crawl
  kind: tank
  x: 27
  y: -432
  label: crawl (URL総数)
  icon: link
  # TABLE_ROWS は InnoDB の推定値で実数と 10% ずれ、 統計再計算のたびに上下する
  # (2026-07-23: embedding が 72.9M→69.2M と「減った」ように見えた誤報の原因)。
  # 実カウントに変更。 重いので metric_ttl_s で背景更新に回す。
  metric_sql: SELECT COUNT(*) FROM crawl
  metric_ttl_s: 900
  capacity_warn: 500000000
