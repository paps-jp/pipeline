edges:
- from: paprika-links-pull
  to: crawl
  label: URL/min
  metric_field: inserted
- from: crawl
  to: paprika-job-submit
- from: paprika-job-submit
  to: paprika-hub
  label: job/min
  metric_field: submitted
- from: paprika-hub
  to: paprika-image-pull
  dashed: true
- from: paprika-hub
  to: paprika-video-pull
  dashed: true
- from: paprika-hub
  to: paprika-links-pull
  dashed: true
- from: paprika-image-pull
  to: crawl_image
  label: img/tick
  metric_field: inserted
- from: crawl_image
  to: image-dispatcher
- from: image-dispatcher
  to: image_hash_extract_queue
  label: enq
  metric_field: hash_detect_enqueued
- from: image_hash_extract_queue
  to: image-hash-extract
- from: image-hash-extract
  to: crawl_face
  label: face
- from: image-hash-extract
  to: crawl_image_hash
  label: hash
- from: crawl_image_hash
  to: image-hash-extract
  dashed: true
- from: crawl_face
  to: image-embed
- from: image-embed
  to: embed_write_queue
  label: write_q
- from: paprika-video-pull
  to: crawl_video
  label: video/tick
  metric_field: inserted
- from: crawl_video
  to: video-dispatcher
- from: video-dispatcher
  to: video_face_extract_queue
  label: task
  metric_field: enqueued
- from: video-face-extract
  to: crawl_face
  label: face/run
  metric_field: face_ids_inserted
- from: video-face-extract
  to: crawl_video_hash
  label: hash
- from: crawl_video_hash
  to: video-face-extract
  dashed: true
- from: embed_write_queue
  to: embed-write
- from: embed-write
  to: crawl_embedding_final
  label: final
  metric_field: claimed
- from: embed-write
  to: face_person_link_queue
  label: enq
- from: face_person_link_queue
  to: face-person-link
- from: face-person-link
  to: crawl_person
  label: person
- from: image-hash-extract
  to: image_embed_queue
  label: enq
- from: image_embed_queue
  to: image-embed
- from: video_face_extract_queue
  to: video-face-extract
- from: image-dispatcher
  to: image_dispatcher_queue
- from: image_dispatcher_queue
  to: image-dispatcher
- from: video-dispatcher
  to: video_dispatcher_queue
- from: video_dispatcher_queue
  to: video-dispatcher
- from: paprika-links-pull
  to: paprika_links_pull_queue
- from: paprika_links_pull_queue
  to: paprika-links-pull
- from: paprika-image-pull
  to: paprika_image_pull_queue
- from: paprika_image_pull_queue
  to: paprika-image-pull
- from: paprika-video-pull
  to: paprika_video_pull_queue
- from: paprika_video_pull_queue
  to: paprika-video-pull
- from: paprika-job-submit
  to: paprika_job_submit_queue
- from: paprika_job_submit_queue
  to: paprika-job-submit
